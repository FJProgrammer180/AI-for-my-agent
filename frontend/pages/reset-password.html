<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atur Ulang Kata Sandi — FINOVA</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<canvas id="particle-canvas" aria-hidden="true"></canvas>

<div class="auth-wrap">
  <div class="auth-visual">
    <a href="/" class="brand">FINOVA</a>
    <div class="quote">Buat kata sandi barumu.
      <small>Pilih yang kuat dan unik — jangan gunakan ulang kata sandi lama.</small>
    </div>
    <div class="footer-note">© 2026 FINOVA</div>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <a href="/" class="brand">FINOVA</a>
      <h1>Kata Sandi Baru</h1>
      <p class="sub">Tautan ini berlaku satu jam dan hanya bisa dipakai sekali.</p>

      <div class="form-alert" id="form-alert"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">Kata Sandi Baru</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" required maxlength="128">
          <div class="password-meter"><span id="meter-bar"></span></div>
          <div class="field-error" data-error="password"></div>
        </div>
        <div class="field">
          <label for="confirmPassword">Konfirmasi Kata Sandi Baru</label>
          <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required maxlength="128">
          <div class="field-error" data-error="confirmPassword"></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Simpan Kata Sandi Baru</button>
      </form>

      <p class="auth-alt"><a href="/login">← Kembali masuk</a></p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/particles.js"></script>
<script src="/js/cursor.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
