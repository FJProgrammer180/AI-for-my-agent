<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Kata Sandi — FINOVA</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<canvas id="particle-canvas" aria-hidden="true"></canvas>
<a href="/" class="btn btn-ghost btn-sm auth-back">← Beranda</a>

<div class="auth-wrap">
  <div class="auth-visual">
    <a href="/" class="brand">FINOVA</a>
    <div class="quote">Kata sandi terlupa? Tenang.
      <small>Kami akan membantumu mengatur ulang dengan aman.</small>
    </div>
    <div class="footer-note">© 2026 FINOVA</div>
  </div>

  <div class="auth-panel">
    <div class="auth-card">
      <a href="/" class="brand">FINOVA</a>
      <h1>Atur Ulang Kata Sandi</h1>
      <p class="sub">Masukkan email akunmu. Bila terdaftar, kami buatkan tautan atur ulang.</p>

      <div class="form-alert" id="form-alert"></div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required placeholder="kamu@email.com">
          <div class="field-error" data-error="email"></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Kirim Tautan Atur Ulang</button>
      </form>

      <p class="auth-alt"><a href="/login">← Kembali masuk</a></p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/particles.js"></script>
<script src="/js/cursor.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
