services:
  db:
    image: postgres:16-alpine
    container_name: finova-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finova
      POSTGRES_USER: finova
      POSTGRES_PASSWORD: finova-dev-password
    ports:
      - "5432:5432"
    volumes:
      - finova-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finova -d finova"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: node:22-alpine
    container_name: finova-app
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://finova:finova-dev-password@db:5432/finova
    command: sh -c "npm ci && npm run migrate && npm run seed && npm run start"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  finova-pgdata:
